<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SSO Timebook — Manager Dashboard</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --teal:#1D9E75;--teal-light:#E1F5EE;--teal-dark:#085041;
  --amber:#BA7517;--amber-light:#FAEEDA;
  --green:#3B6D11;--green-light:#EAF3DE;
  --red:#A32D2D;--red-light:#FCEBEB;
  --gray-bg:#F5F5F3;--border:#E2E0D9;
  --text:#1A1A18;--muted:#6B6B66;
  --white:#FFFFFF;--radius:10px;--radius-lg:14px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--gray-bg);color:var(--text);font-size:13px;}
.header{background:var(--white);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;position:sticky;top:0;z-index:50;}
.header h1{font-size:18px;font-weight:700;}
.header p{font-size:12px;color:var(--muted);margin-top:2px;}
.header-right{display:flex;gap:8px;flex-wrap:wrap;}
.btn{padding:8px 14px;border-radius:var(--radius);font-size:12px;font-weight:600;border:1px solid var(--border);cursor:pointer;background:var(--white);color:var(--text);}
.btn:active{transform:scale(0.97);}
.btn-primary{background:var(--teal);color:white;border-color:var(--teal);}
.btn-export{background:var(--teal-light);color:var(--teal-dark);border-color:var(--teal);}
.main{max-width:1400px;margin:0 auto;padding:16px 16px 60px;}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:16px;}
.stat-card{background:var(--white);border-radius:var(--radius);border:1px solid var(--border);padding:12px 14px;}
.stat-card .v{font-size:22px;font-weight:700;display:block;}
.stat-card .l{font-size:11px;color:var(--muted);margin-top:1px;display:block;}
.v-sub{color:var(--amber);}.v-app{color:var(--green);}.v-tot{color:var(--teal);}
.filter-bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center;}
.filter-bar input{flex:1;min-width:180px;padding:7px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--white);color:var(--text);font-size:13px;}
.filter-bar select{padding:7px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--white);color:var(--text);font-size:13px;}
.grid-wrap{background:var(--white);border-radius:var(--radius-lg);border:1px solid var(--border);overflow:auto;}
table{width:100%;border-collapse:collapse;font-size:11px;min-width:900px;}
thead th{background:#F9F8F5;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;color:var(--muted);padding:8px 6px;border-bottom:1px solid var(--border);text-align:center;white-space:nowrap;position:sticky;top:0;z-index:5;}
thead th:first-child{text-align:left;padding-left:14px;min-width:160px;position:sticky;left:0;z-index:10;background:#F9F8F5;}
tbody tr{border-bottom:1px solid var(--border);}
tbody tr:hover{background:#FAFAF8;}
tbody tr:last-child{border-bottom:none;}
tbody td{padding:6px 4px;text-align:center;vertical-align:middle;}
tbody td:first-child{padding-left:14px;text-align:left;position:sticky;left:0;background:var(--white);z-index:4;border-right:1px solid var(--border);}
tbody tr:hover td:first-child{background:#FAFAF8;}
.emp-name{font-weight:600;font-size:12px;}
.emp-id{font-size:10px;color:var(--muted);}
.cell-empty{color:var(--border);font-size:16px;}
.cell-draft{background:#F5F5F3;border-radius:6px;padding:3px 2px;}
.cell-submitted{background:var(--amber-light);border-radius:6px;padding:3px 2px;}
.cell-approved{background:var(--green-light);border-radius:6px;padding:3px 2px;}
.status-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:2px;vertical-align:middle;}
.dot-draft{background:var(--muted);}
.dot-submitted{background:var(--amber);}
.dot-approved{background:var(--green);}
.cell-btn{font-size:9px;font-weight:600;padding:2px 5px;border-radius:4px;border:none;cursor:pointer;margin-top:2px;display:block;width:100%;text-align:center;}
.btn-view-sub{background:var(--amber);color:white;}
.btn-view-app{background:var(--green-light);color:var(--green);border:1px solid var(--green);}
.btn-view-dft{background:var(--gray-bg);color:var(--muted);border:1px solid var(--border);}
.legend{display:flex;gap:14px;margin-bottom:10px;flex-wrap:wrap;}
.legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:200;overflow-y:auto;padding:16px;}
.overlay.open{display:block;}
.detail{background:var(--white);border-radius:var(--radius-lg);max-width:880px;margin:0 auto;padding:24px;}
.detail-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;}
.detail-top h2{font-size:18px;font-weight:700;}
.detail-top p{color:var(--muted);font-size:12px;margin-top:3px;}
.close-btn{font-size:20px;cursor:pointer;background:none;border:none;color:var(--muted);}
.d-stats{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.ds{background:var(--gray-bg);padding:10px 14px;border-radius:var(--radius);flex:1;min-width:100px;text-align:center;}
.ds .v{font-size:18px;font-weight:700;display:block;}
.ds .l{font-size:10px;color:var(--muted);}
.pos{color:var(--green);font-weight:700;}
.neg{color:var(--red);font-weight:700;}
.d-tbl-wrap{overflow-x:auto;margin-bottom:14px;}
.d-tbl{width:100%;border-collapse:collapse;font-size:11px;min-width:540px;}
.d-tbl thead th{background:#F9F8F5;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:var(--muted);padding:6px 6px;border-bottom:1px solid var(--border);text-align:center;}
.d-tbl tbody td{padding:4px 6px;border-bottom:1px solid var(--border);font-size:11px;text-align:center;}
.d-tbl tbody tr.ph-r{background:#FFF8EC;}
.d-tbl tbody tr.we-r{background:#FAFAF8;opacity:0.72;}
.d-actions{display:flex;gap:8px;flex-wrap:wrap;}
.btn-approve{background:var(--teal);color:white;border-color:var(--teal);}
.btn-unlock{color:var(--red);border-color:var(--red);}
.pill{font-size:10px;font-weight:700;padding:2px 8px;border-radius:100px;}
.p-draft{background:#F1EFE8;color:var(--muted);}
.p-submitted{background:var(--amber-light);color:var(--amber);}
.p-approved{background:var(--green-light);color:var(--green);}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:white;padding:9px 18px;border-radius:100px;font-size:12px;font-weight:600;z-index:500;opacity:0;pointer-events:none;transition:opacity 0.3s;white-space:nowrap;}
.toast.show{opacity:1;}
.spinner{width:24px;height:24px;border:3px solid var(--border);border-top-color:var(--teal);border-radius:50%;animation:spin 0.8s linear infinite;display:inline-block;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading{display:flex;align-items:center;gap:10px;padding:32px;color:var(--muted);}
@media(max-width:640px){.main{padding:10px 10px 60px;}.detail{padding:14px;}}
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>📋 SSO Timebook — Manager Dashboard</h1>
    <p id="hdr-sub">Loading…</p>
  </div>
  <div class="header-right">
    <button class="btn btn-export" onclick="exportAll()">⬇ Export CSV</button>
    <button class="btn btn-primary" onclick="loadAll()">↻ Refresh</button>
  </div>
</div>

<div class="main">
  <div class="stats">
    <div class="stat-card"><span class="v v-tot" id="s-emp">—</span><span class="l">Total SSOs</span></div>
    <div class="stat-card"><span class="v v-sub" id="s-sub">—</span><span class="l">Awaiting Approval</span></div>
    <div class="stat-card"><span class="v v-app" id="s-app">—</span><span class="l">Approved</span></div>
    <div class="stat-card"><span class="v" id="s-draft">—</span><span class="l">In Progress</span></div>
    <div class="stat-card"><span class="v" id="s-none" style="color:var(--border)">—</span><span class="l">Not Started</span></div>
  </div>

  <div class="filter-bar">
    <input type="text" id="f-search" placeholder="Search by name or ID…" oninput="renderGrid()">
    <select id="f-status" onchange="renderGrid()">
      <option value="">All SSOs</option>
      <option value="has-submitted">Has submissions awaiting approval</option>
      <option value="all-approved">All approved</option>
      <option value="in-progress">Has data in progress</option>
    </select>
  </div>

  <div class="legend">
    <div class="legend-item"><span class="status-dot dot-submitted"></span>Submitted — awaiting approval</div>
    <div class="legend-item"><span class="status-dot dot-approved"></span>Approved</div>
    <div class="legend-item"><span class="status-dot dot-draft"></span>In progress / draft</div>
    <div class="legend-item" style="color:var(--border)">· Not started</div>
  </div>

  <div class="grid-wrap">
    <table id="main-table">
      <thead id="thead"></thead>
      <tbody id="tbody"><tr><td colspan="14"><div class="loading"><div class="spinner"></div>Loading…</div></td></tr></tbody>
    </table>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="detail" id="detail-content"></div>
</div>
<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL='https://qzpbupizqaxssyhecsdx.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF6cGJ1cGl6cWF4c3N5aGVjc2R4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2MDM5ODksImV4cCI6MjA5NjE3OTk4OX0.WMQTiPz-AsEl-nzAzn4zRnbZdmqOObUFdLvaagrwJ4Q';
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const MONTH_SHORT=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const PUBLIC_HOLIDAYS={'2026-01-01':"New Year's Day",'2026-01-26':'Australia Day','2026-04-03':'Good Friday','2026-04-06':'Easter Monday','2026-04-25':'ANZAC Day','2026-06-08':"King's Birthday",'2026-12-25':'Christmas Day','2026-12-28':'Proclamation Day (sub)'};

let employees=[],timesheets=[],filtered=[];

async function sb(path,method='GET',body=null){
  const opts={method,headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json'}};
  if(body)opts.body=JSON.stringify(body);
  const r=await fetch(SUPABASE_URL+'/rest/v1'+path,opts);
  if(!r.ok)throw new Error(r.status+': '+await r.text());
  const t=await r.text();return t?JSON.parse(t):null;
}

function parseTime(t){if(!t||!t.includes(':'))return null;const[h,m]=t.split(':').map(Number);return isNaN(h)||isNaN(m)?null:h*60+m;}
function calcWorked(row){const a=parseTime(row.arrival),d=parseTime(row.depart);if(a===null||d===null)return'';let w=d-a;const s1=parseTime(row.startBreak1),e1=parseTime(row.endBreak1);if(s1!==null&&e1!==null&&e1>s1)w-=(e1-s1);const s2=parseTime(row.startBreak2),e2=parseTime(row.endBreak2);if(s2!==null&&e2!==null&&e2>s2)w-=(e2-s2);return w<0?'0.00':(w/60).toFixed(2);}
function totals(rows){let tw=0,tr=0;(rows||[]).forEach(r=>{tw+=parseFloat(calcWorked(r))||0;tr+=parseFloat(r.rostered)||0;});return{worked:tw,rostered:tr,variation:tw-tr};}
function getDayName(iso){return['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][new Date(iso+'T00:00:00').getDay()];}
function isWE(iso){const d=new Date(iso+'T00:00:00').getDay();return d===0||d===6;}

function getSheet(empId,mi){return timesheets.find(t=>t.employee_id===empId&&t.month_index===mi)||null;}

async function loadAll(){
  document.getElementById('tbody').innerHTML='<tr><td colspan="14"><div class="loading"><div class="spinner"></div>Loading…</div></td></tr>';
  try{
    const [emps,sheets]=await Promise.all([
      sb('/employees?select=*&order=name.asc'),
      sb('/timesheets?year=eq.2026&select=*&order=updated_at.desc&limit=2000')
    ]);
    employees=emps||[];
    timesheets=(sheets||[]).map(s=>({
      ...s,
      rows:s.rows?(typeof s.rows==='string'?JSON.parse(s.rows):s.rows):[]
    }));
    updateStats();
    document.getElementById('hdr-sub').textContent='Kelsey Enright · '+employees.length+' SSOs · Last refreshed '+new Date().toLocaleTimeString('en-AU',{hour:'2-digit',minute:'2-digit'});
    renderGrid();
  }catch(e){
    document.getElementById('tbody').innerHTML='<tr><td colspan="14" style="padding:24px;color:var(--red)">⚠ Error: '+e.message+'</td></tr>';
    console.error(e);
  }
}

function updateStats(){
  document.getElementById('s-emp').textContent=employees.length;
  document.getElementById('s-sub').textContent=timesheets.filter(t=>t.status==='submitted').length;
  document.getElementById('s-app').textContent=timesheets.filter(t=>t.status==='approved').length;
  document.getElementById('s-draft').textContent=timesheets.filter(t=>t.status==='draft').length;
  document.getElementById('s-none').textContent=employees.length*12-timesheets.length;
}

function renderGrid(){
  const search=document.getElementById('f-search').value.toLowerCase();
  const filter=document.getElementById('f-status').value;
  filtered=employees.filter(emp=>{
    if(search&&!emp.name.toLowerCase().includes(search)&&!emp.employee_id.toLowerCase().includes(search))return false;
    const sheets=timesheets.filter(t=>t.employee_id===emp.employee_id);
    if(filter==='has-submitted'&&!sheets.some(s=>s.status==='submitted'))return false;
    if(filter==='all-approved'&&!sheets.every(s=>s.status==='approved'))return false;
    if(filter==='in-progress'&&!sheets.some(s=>s.status==='draft'))return false;
    return true;
  });
  document.getElementById('thead').innerHTML='<tr><th>Employee</th>'+MONTH_SHORT.map(m=>'<th>'+m+'</th>').join('')+'</tr>';
  if(!filtered.length){
    document.getElementById('tbody').innerHTML='<tr><td colspan="14" style="padding:32px;text-align:center;color:var(--muted)">No SSOs match your filter.</td></tr>';
    return;
  }
  document.getElementById('tbody').innerHTML=filtered.map((emp)=>{
    const monthCells=MONTHS.map((_,mi)=>{
      const sheet=getSheet(emp.employee_id,mi);
      if(!sheet)return '<td><span class="cell-empty">·</span></td>';
      const s=sheet.status;
      const cellClass=s==='submitted'?'cell-submitted':s==='approved'?'cell-approved':'cell-draft';
      const dotClass=s==='submitted'?'dot-submitted':s==='approved'?'dot-approved':'dot-draft';
      const btnClass=s==='submitted'?'btn-view-sub':s==='approved'?'btn-view-app':'btn-view-dft';
      const btnLabel=s==='submitted'?'Review →':s==='approved'?'✓ View':'View';
      return '<td><div class="'+cellClass+'"><span class="status-dot '+dotClass+'"></span><button class="cell-btn '+btnClass+'" onclick="openDetail(\''+emp.employee_id+'\','+mi+')">'+btnLabel+'</button></div></td>';
    }).join('');
    return '<tr><td><div class="emp-name">'+emp.name+'</div><div class="emp-id">'+emp.employee_id+'</div></td>'+monthCells+'</tr>';
  }).join('');
}

function openDetail(empId,mi){
  const emp=employees.find(e=>e.employee_id===empId);
  const sheet=getSheet(empId,mi);
  if(!emp||!sheet)return;
  const t=totals(sheet.rows);
  const s=sheet.status;
  const pc=s==='approved'?'p-approved':s==='submitted'?'p-submitted':'p-draft';
  const pt=s==='approved'?'✓ Approved':s==='submitted'?'⏳ Submitted':'Draft';
  const rowsHtml=(sheet.rows||[]).map(row=>{
    const w=calcWorked(row),v=parseFloat(w||0)-parseFloat(row.rostered||0);
    const ph=PUBLIC_HOLIDAYS[row.date],we=isWE(row.date);
    const hasOT=row._overtimeApprover;
    const notesContent=hasOT?'<span style="color:var(--green);font-size:10px">✓ '+row._overtimeApprover+': '+row._overtimeReason+'</span>':(row.notes||'');
    return '<tr class="'+(ph?'ph-r':we?'we-r':'')+'"><td>'+getDayName(row.date)+' '+parseInt(row.date.split('-')[2])+(ph?' <span style="font-size:9px;background:var(--amber);color:white;padding:0 3px;border-radius:3px">PH</span>':'')+'</td><td>'+(row.arrival||'—')+'</td><td>'+(row.startBreak1||'—')+'</td><td>'+(row.endBreak1||'—')+'</td><td>'+(row.startBreak2||'—')+'</td><td>'+(row.endBreak2||'—')+'</td><td>'+(row.depart||'—')+'</td><td><strong>'+(w||'—')+'</strong></td><td>'+(row.rostered||'—')+'</td><td class="'+(row.arrival?(v>=0?'pos':'neg'):'')+'">'+(row.arrival?(v>=0?'+':'')+v.toFixed(2):'—')+'</td><td style="font-size:10px;text-align:left">'+notesContent+'</td></tr>';
  }).join('');
  const approveBtn=s==='submitted'?'<button class="btn btn-approve" onclick="approveItem(\''+empId+'\','+mi+')">✓ Approve Timesheet</button>':'';
  const unlockBtn=s==='approved'?'<button class="btn btn-unlock" onclick="unlockItem(\''+empId+'\','+mi+')">↩ Unlock for editing</button>':'';
  document.getElementById('detail-content').innerHTML=
    '<div class="detail-top"><div><h2>'+emp.name+'</h2><p>'+emp.employee_id+' &nbsp;·&nbsp; '+MONTHS[mi]+' 2026 &nbsp;·&nbsp; <span class="pill '+pc+'">'+pt+'</span></p></div><button class="close-btn" onclick="closeDetail()">✕</button></div>'+
    '<div class="d-stats"><div class="ds"><span class="v">'+t.worked.toFixed(2)+'</span><span class="l">Hours worked</span></div><div class="ds"><span class="v">'+t.rostered.toFixed(2)+'</span><span class="l">Rostered</span></div><div class="ds"><span class="v '+(t.variation>=0?'pos':'neg')+'">'+(t.variation>=0?'+':'')+t.variation.toFixed(2)+'</span><span class="l">Variation</span></div></div>'+
    '<div class="d-tbl-wrap"><table class="d-tbl"><thead><tr><th>Date</th><th>Arrival</th><th>B1 S</th><th>B1 E</th><th>B2 S</th><th>B2 E</th><th>Depart</th><th>Worked</th><th>Rostered</th><th>Variation</th><th>Notes / OT</th></tr></thead><tbody>'+rowsHtml+'</tbody></table></div>'+
    '<div class="d-actions">'+approveBtn+unlockBtn+'<button class="btn btn-export" onclick="exportSingle(\''+empId+'\','+mi+')">⬇ Export CSV</button><button class="btn" onclick="window.print()">🖨 Print</button></div>';
  document.getElementById('overlay').classList.add('open');
}

function closeDetail(){document.getElementById('overlay').classList.remove('open');}
document.getElementById('overlay').addEventListener('click',e=>{if(e.target===document.getElementById('overlay'))closeDetail();});

async function approveItem(empId,mi){
  const emp=employees.find(e=>e.employee_id===empId);
  const sheet=getSheet(empId,mi);
  if(!sheet||!confirm('Approve '+emp.name+"'s timesheet for "+MONTHS[mi]+' 2026?\n\nThis will lock it for the employee.'))return;
  try{
    await sb('/timesheets?id=eq.'+sheet.id,'PATCH',{status:'approved',updated_at:new Date().toISOString()});
    sheet.status='approved';
    updateStats();renderGrid();closeDetail();
    showToast('✓ Approved — '+emp.name+', '+MONTHS[mi]);
  }catch(e){alert('Error: '+e.message);}
}

async function unlockItem(empId,mi){
  const emp=employees.find(e=>e.employee_id===empId);
  const sheet=getSheet(empId,mi);
  if(!sheet||!confirm('Unlock '+emp.name+"'s "+MONTHS[mi]+' timesheet for editing?'))return;
  try{
    await sb('/timesheets?id=eq.'+sheet.id,'PATCH',{status:'draft',updated_at:new Date().toISOString()});
    sheet.status='draft';
    updateStats();renderGrid();closeDetail();
    showToast('↩ Unlocked — '+emp.name+', '+MONTHS[mi]);
  }catch(e){alert('Error: '+e.message);}
}

function exportAll(){
  const rows=[['Employee','ID','Month','Date','Day','Arrival','Brk1S','Brk1E','Brk2S','Brk2E','Depart','WorkedHrs','RosteredHrs','Variation','Notes','OT Approver','OT Reason','Status']];
  employees.forEach(emp=>{
    timesheets.filter(t=>t.employee_id===emp.employee_id).forEach(sheet=>{
      (sheet.rows||[]).forEach(r=>{
        const w=calcWorked(r),v=r.arrival?(parseFloat(w||0)-parseFloat(r.rostered||0)).toFixed(2):'';
        rows.push([emp.name,emp.employee_id,MONTHS[sheet.month_index],r.date,getDayName(r.date),r.arrival,r.startBreak1,r.endBreak1,r.startBreak2,r.endBreak2,r.depart,w,r.rostered,v,r.notes,r._overtimeApprover||'',r._overtimeReason||'',sheet.status]);
      });
    });
  });
  dl(rows,'SSO_Timebook_2026_All.csv');
}

function exportSingle(empId,mi){
  const emp=employees.find(e=>e.employee_id===empId);
  const sheet=getSheet(empId,mi);
  if(!emp||!sheet)return;
  const rows=[['Employee','ID','Month','Date','Day','Arrival','Brk1S','Brk1E','Brk2S','Brk2E','Depart','WorkedHrs','RosteredHrs','Variation','Notes','OT Approver','OT Reason']];
  (sheet.rows||[]).forEach(r=>{
    const w=calcWorked(r),v=r.arrival?(parseFloat(w||0)-parseFloat(r.rostered||0)).toFixed(2):'';
    rows.push([emp.name,emp.employee_id,MONTHS[mi],r.date,getDayName(r.date),r.arrival,r.startBreak1,r.endBreak1,r.startBreak2,r.endBreak2,r.depart,w,r.rostered,v,r.notes,r._overtimeApprover||'',r._overtimeReason||'']);
  });
  dl(rows,'SSO_'+emp.employee_id+'_'+MONTHS[mi]+'_2026.csv');
}

function dl(rows,fn){
  const csv=rows.map(r=>r.map(c=>'"'+(c||'').toString().replace(/"/g,'""')+'"').join(',')).join('\n');
  const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);a.download=fn;a.click();
}
